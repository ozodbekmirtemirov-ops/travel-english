<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#2F9BFF"/><stop offset=".55" stop-color="#1673F0"/><stop offset="1" stop-color="#0C3FB8"/>
  </linearGradient>
  <radialGradient id="glow" cx=".22" cy=".12" r=".75">
   <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E6EEFC"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1673F0"/><stop offset="1" stop-color="#0C3FB8"/></linearGradient>
  <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BE39C"/><stop offset="1" stop-color="#1FB866"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#062a7a" flood-opacity=".38"/></filter>
  <filter id="sh2" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#062a7a" flood-opacity=".35"/></filter>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
 <rect width="1024" height="1024" fill="url(#glow)"/>
 <!-- globe lines -->
 <g fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="10">
  <circle cx="512" cy="1040" r="520"/><ellipse cx="512" cy="1040" rx="250" ry="520"/><path d="M-10 700 Q512 600 1034 700"/><path d="M-10 860 Q512 790 1034 860"/>
 </g>
 <!-- flight path -->
 <path d="M150 820 C 230 560, 520 330, 820 250" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 44"/>
 <!-- speech bubble -->
 <g filter="url(#sh)">
  <path d="M318 352 h388 a118 118 0 0 1 118 118 v172 a118 118 0 0 1 -118 118 h-262 l-104 84 a14 14 0 0 1 -22 -13 l14 -71 h-14 a118 118 0 0 1 -118 -118 v-172 a118 118 0 0 1 118 -118z" fill="url(#bub)"/>
 </g>
 <text x="512" y="642" text-anchor="middle" font-family="'Fira Sans','DM Sans','Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="250" letter-spacing="-6" fill="url(#txt)">EN</text>
 <!-- green check badge -->
 <g filter="url(#sh2)"><circle cx="772" cy="742" r="74" fill="url(#grn)"/><path d="M738 744 l24 24 l46 -50" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g>
 <!-- airplane -->
 <g transform="translate(828 236) rotate(-28) scale(5.4)" filter="url(#sh2)">
  <path fill="#ffffff" d="M-22 -2.2 L15 -2.6 Q22 0 15 2.6 L-22 2.2 Q-24 0 -22 -2.2Z"/>
  <path fill="#ffffff" d="M-2 -2 L-10 -19 L-4.5 -19 L9 -2Z M-2 2 L-10 19 L-4.5 19 L9 2Z"/>
  <path fill="#ffffff" d="M-17 -1.8 L-22 -9.5 L-18.5 -9.5 L-12.5 -1.8Z M-17 1.8 L-22 9.5 L-18.5 9.5 L-12.5 1.8Z"/>
  <circle cx="13" cy="0" r="1.2" fill="#1673F0"/>
 </g>
</svg>
