<!DOCTYPE html>
<html lang="ru" data-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRAVEL ENGLISH</title>
<meta name="description" content="Learn English. Travel confidently. 600 travel words, combinations and sentences.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travel English">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: calm, premium, encouraging — a pocket travel coach.
IDEA: a boarding-pass / passport-stamp journey; each lesson is a stop on a route.
PICTURE: soft illustrated lesson tiles, big study cards, a live progress ring.
COLOUR and TYPE: white cards on #f5f5f7, graphite ink, soft green for progress, quiet blue for actions, red only for errors. Inter / system SF.
LAYOUT: mobile-first single column with bottom tab bar; sidebar from 900px; focused full-screen sessions.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f5f5f7,#0b0c0f);--card:light-dark(#ffffff,#18191d);--card2:light-dark(#fbfbfd,#1f2025);
--ink:light-dark(#1d1d1f,#f2f2f5);--ink2:light-dark(#6e6e73,#a1a1a8);--ink3:light-dark(#a1a1a6,#6b6b72);
--line:light-dark(#e6e6eb,#2a2b31);--soft:light-dark(#f0f0f4,#24252b);
--green:light-dark(#22a861,#3ccf82);--green-bg:light-dark(#e6f6ed,#132a1d);--green-ink:light-dark(#137a43,#7fe2ad);
--blue:light-dark(#0a74f0,#4aa3ff);--blue-bg:light-dark(#e8f1fe,#13233a);
--red:light-dark(#e5382e,#ff6259);--red-bg:light-dark(#fdeceb,#3a1817);
--amber:light-dark(#e58a00,#ffb340);
--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px light-dark(rgba(20,20,40,.06),rgba(0,0,0,.35));
--r:22px;--r2:16px;--nav:68px;
--font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
:root[data-mode=system][data-theme=dark]{color-scheme:dark}:root[data-mode=system][data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sm svg.i,svg.i.sm{width:18px;height:18px}

/* layout */
#app{min-height:100%}
.shell{display:flex;min-height:100vh}
.main{flex:1;padding:max(18px,env(safe-area-inset-top)) 18px calc(var(--nav) + 28px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:light-dark(rgba(255,255,255,.86),rgba(24,25,29,.86));backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--ink3);font-size:11px;font-weight:600;min-height:52px;transition:color .2s}
.nav button.on{color:var(--blue)}
.nav button:active{transform:scale(.94)}
.brand-side{display:none}
@media(min-width:900px){
 .nav{position:sticky;top:0;bottom:auto;height:100vh;width:236px;flex-direction:column;justify-content:flex-start;gap:4px;padding:26px 14px;border-top:0;border-right:1px solid var(--line)}
 .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;min-height:44px;justify-content:flex-start}
 .nav button.on{background:var(--blue-bg)}
 .brand-side{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:800;letter-spacing:.02em;font-size:15px;color:var(--ink)}
 .main{padding:34px 40px 60px}
 .top .logo{visibility:hidden}
}

/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--ink2)}
.tiny{font-size:13px;color:var(--ink2)}
.h1{font-size:clamp(30px,6vw,44px);line-height:1.06;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.h2{font-size:22px;line-height:1.2;font-weight:750;letter-spacing:-.015em}
.h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;font-weight:650;font-size:16px;background:var(--blue);color:#fff;transition:transform .12s,filter .2s,opacity .2s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green-ink)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.red{background:var(--red-bg);color:var(--red)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:var(--green);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.sec-gap{margin-top:28px}
.fade-in{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.stagger>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(8){animation-delay:.35s}.stagger>*:nth-child(9){animation-delay:.4s}.stagger>*:nth-child(10){animation-delay:.45s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes unlock{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes confetti{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.8}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.03em;font-size:15px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.logo-mark svg{width:20px;height:20px}
.logo-mark{overflow:hidden;background:#1673F0;color:#fff}.logo-mark img{width:100%;height:100%;display:block}
.streak{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow)}
.streak svg{color:var(--amber);width:18px;height:18px}
.hero{padding:26px 22px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.hero .greet{font-size:15px;font-weight:600;color:var(--ink2)}
@media(min-width:720px){.hero{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;padding:34px}}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--soft)}.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ring b small{display:block;font-size:11px;font-weight:600;color:var(--ink2);text-align:center;margin-top:-26px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card2);border-radius:var(--r2);padding:12px;box-shadow:inset 0 0 0 1px var(--line)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12px;color:var(--ink2);font-weight:600}
.continue{display:flex;align-items:center;gap:16px;padding:16px;margin-top:16px;width:100%;text-align:left;background:var(--ink);color:var(--bg);border-radius:var(--r);transition:transform .15s}
.continue:active{transform:scale(.985)}
.continue .ci{width:54px;height:54px;border-radius:15px;background:color-mix(in srgb,var(--bg) 14%,transparent);display:grid;place-items:center;font-size:28px;flex:none}
.continue .ct{flex:1}.continue .ct small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.65}
.continue .ct b{font-size:17px}.continue .ct span{display:block;font-size:13px;opacity:.7}
.continue .go{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.reminder{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-top:14px;border-radius:var(--r2);background:var(--blue-bg);color:var(--ink);font-size:14px}
.reminder svg{color:var(--blue)}

/* section cards */
.sec-card{overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .2s,box-shadow .2s;width:100%}
.sec-card:hover{transform:translateY(-3px)}
.sec-art{height:150px;position:relative;overflow:hidden}
.sec-art svg{position:absolute;inset:0;width:100%;height:100%}
.sec-body{padding:18px 20px 20px;display:grid;gap:10px}
.sec-body .meta{display:flex;flex-wrap:wrap;gap:6px}
.locked{opacity:.62}
.lock-badge{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}

/* section page */
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--blue);min-height:44px;margin-bottom:6px}
.sec-head{overflow:hidden}
.sec-head .sec-art{height:170px}
.sec-head .in{padding:20px 22px 22px;display:grid;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.lesson{overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%;transition:transform .2s}
.lesson:not(.locked):hover{transform:translateY(-3px)}
.lesson.unlock-anim{animation:unlock 1.2s ease-out 3,pop .6s}
.les-art{height:118px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,light-dark(hsl(var(--h) 85% 93%),hsl(var(--h) 32% 21%)),light-dark(hsl(calc(var(--h) + 38) 78% 86%),hsl(calc(var(--h) + 38) 30% 14%)))}
.les-art .e1{font-size:54px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));z-index:1}
.les-art .e2,.les-art .e3{position:absolute;font-size:30px;opacity:.9}
.les-art .e2{left:16%;top:20%;transform:rotate(-12deg)}.les-art .e3{right:15%;bottom:16%;transform:rotate(10deg)}
.les-art .num{position:absolute;left:14px;top:12px;font-size:12px;font-weight:800;letter-spacing:.05em;color:light-dark(rgba(0,0,0,.6),rgba(255,255,255,.85));background:light-dark(rgba(255,255,255,.72),rgba(0,0,0,.35));padding:3px 9px;border-radius:99px}
.les-body{padding:16px 18px 18px;display:grid;gap:9px;flex:1}
.les-body .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.les-body .foot .tiny{white-space:nowrap}

/* lesson intro */
.stages{display:grid;gap:10px}
.stage{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r2);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.stage .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;font-size:14px;flex:none;color:var(--ink2)}
.stage.done .dot{background:var(--green);color:#fff}
.stage.cur{box-shadow:inset 0 0 0 2px var(--blue)}.stage.cur .dot{background:var(--blue);color:#fff}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.wordlist div{padding:10px 12px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.wordlist b{display:block;font-weight:650}
.wordlist span{color:var(--ink2);font-size:13px}

/* session */
.session{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
.s-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--bg);max-width:760px;width:100%;margin:0 auto}
.s-top .bar{flex:1;height:10px}
.s-top .cnt{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.s-label{max-width:760px;width:100%;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.s-body{flex:1;max-width:760px;width:100%;margin:0 auto;padding:14px 18px 150px;display:flex;flex-direction:column}
.s-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 26%)}
.s-foot .in{max-width:724px;margin:0 auto;display:flex;gap:10px}
.s-foot .in .btn{flex:1}
.study{padding:30px 22px;text-align:center;display:grid;gap:14px;justify-items:center;animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
.study .em{font-size:84px;line-height:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.14))}
.study .en{font-size:clamp(32px,8vw,48px);font-weight:800;letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
.study.sent .en{font-size:clamp(26px,6vw,36px)}
.study .ru{font-size:20px;color:var(--ink2);font-weight:500;text-wrap:balance}
.study .ru.hid{filter:blur(8px);user-select:none;cursor:pointer}
.audio-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.audio{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:99px;background:var(--blue-bg);color:var(--blue);font-weight:650;font-size:15px;transition:transform .12s}
.audio:active{transform:scale(.95)}
.audio.speaking svg{animation:pulse .6s ease-in-out infinite}
.audio.big{width:96px;height:96px;padding:0;justify-content:center;border-radius:50%}
.audio.big svg{width:40px;height:40px}
.q{display:grid;gap:18px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.q .ask{font-size:14px;font-weight:700;color:var(--ink2)}
.q .prompt{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.q .prompt.ru{font-weight:700}
.q .prompt.sent{font-size:clamp(22px,5.4vw,30px)}
.q .pic{font-size:96px;line-height:1.1;text-align:center}
.q .center{display:flex;justify-content:center;padding:8px 0}
.opts{display:grid;gap:10px}
@media(min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{min-height:58px;padding:14px 18px;border-radius:var(--r2);background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line);text-align:left;font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px;transition:transform .1s,background .2s,box-shadow .2s}
.opt kbd{font:700 12px var(--font);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--soft);color:var(--ink2);flex:none}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--green-bg);box-shadow:inset 0 0 0 2px var(--green);color:var(--green-ink);animation:pop .4s}
.opt.bad{background:var(--red-bg);box-shadow:inset 0 0 0 2px var(--red);color:var(--red);animation:shake .45s}
.opts.done .opt{pointer-events:none}
.field{width:100%;min-height:58px;padding:14px 18px;border-radius:var(--r2);border:0;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line);font-size:19px;font-weight:600;outline:0;transition:box-shadow .2s}
.field:focus{box-shadow:var(--shadow),inset 0 0 0 2px var(--blue)}
.field.ok{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-bg)}
.field.bad{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-bg);animation:shake .45s}
.hintline{font-size:15px;color:var(--ink2);letter-spacing:.12em;font-weight:700;text-align:center}
.build-ans{min-height:76px;padding:12px;border-radius:var(--r2);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:box-shadow .2s}
.build-ans.ok{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-bg)}
.build-ans.bad{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-bg);animation:shake .45s}
.build-ans:empty::before{content:attr(data-ph);color:var(--ink3);font-size:15px;padding:8px 4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:46px;padding:0 15px;border-radius:12px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line),0 3px 0 var(--line);font-weight:650;font-size:17px;transition:transform .12s,opacity .2s}
.tile:active{transform:translateY(2px)}
.tile.used{opacity:0;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{min-height:56px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line);font-weight:650;font-size:16px;transition:all .2s}
.mt.sel{box-shadow:inset 0 0 0 2px var(--blue);background:var(--blue-bg);color:var(--blue)}
.mt.ok{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-bg);color:var(--green-ink);pointer-events:none;opacity:.75}
.mt.bad{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-bg);animation:shake .4s}
.gap-text{font-size:clamp(22px,5.6vw,30px);font-weight:750;line-height:1.3;letter-spacing:-.01em}
.gap-text u{text-decoration:none;display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);color:var(--blue);margin:0 4px}
.flash{perspective:1200px;min-height:300px;cursor:pointer}
.flash .fl{position:relative;width:100%;min-height:300px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flash.flipped .fl{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;align-content:center;gap:12px;padding:26px;text-align:center}
.flash .rear{transform:rotateY(180deg)}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:18px 18px calc(16px + env(safe-area-inset-bottom));animation:sheet .32s cubic-bezier(.2,.8,.2,1) both;border-radius:24px 24px 0 0}
.feedback.ok{background:var(--green-bg)}.feedback.bad{background:var(--red-bg)}
.feedback .in{max-width:724px;margin:0 auto;display:grid;gap:12px}
.feedback .t{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}
.feedback.ok .t{color:var(--green-ink)}.feedback.bad .t{color:var(--red)}
.feedback .t .bub{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;animation:pop .4s}
.feedback.ok .bub{background:var(--green)}.feedback.bad .bub{background:var(--red)}
.feedback .ans{font-size:16px;font-weight:600}
.feedback .ans small{display:block;font-weight:500;color:var(--ink2);font-size:14px}

/* results */
.result{text-align:center;display:grid;gap:18px;justify-items:center;padding:20px 0}
.result .big{font-size:64px;font-weight:850;letter-spacing:-.04em;line-height:1}
.result .ring{width:170px;height:170px}
.result .ring b{font-size:40px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.misslist{display:grid;gap:8px;width:100%;text-align:left}
.miss{padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.miss b{font-weight:700}.miss span{color:var(--ink2);font-size:14px;text-align:right}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:confetti linear forwards}

/* review / progress / settings */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.mode{padding:16px;border-radius:var(--r2);background:var(--card);box-shadow:var(--shadow);text-align:left;display:grid;gap:8px;transition:transform .15s,box-shadow .2s}
.mode:active{transform:scale(.97)}
.mode .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--blue-bg);color:var(--blue)}
.mode b{font-size:15px}.mode span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--soft);gap:2px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:650;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{overflow:hidden}
.li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;min-height:60px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .lt b{display:block;font-weight:600;font-size:15.5px}.li .lt span{font-size:13px;color:var(--ink2)}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--green)}.switch.on::after{transform:translateX(20px)}
input[type=range]{accent-color:var(--blue);width:140px;height:32px}
input[type=time],select{min-height:40px;border-radius:10px;border:0;background:var(--soft);padding:0 10px;font-size:15px}
.lgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.lgrid i{aspect-ratio:1;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700;color:var(--ink3)}
.lgrid i.d{background:var(--green);color:#fff}.lgrid i.p{background:var(--blue-bg);color:var(--blue)}
.hist{display:grid;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.38);display:grid;place-items:center;padding:20px;animation:fadeUp .2s both}
.modal{max-width:400px;width:100%;padding:24px;display:grid;gap:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px);transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);animation:fadeUp .3s both;box-shadow:var(--shadow)}
@media(min-width:900px){.toast{bottom:30px}}
.empty{padding:34px 22px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty .em{font-size:54px}
.warn{padding:12px 16px;border-radius:14px;background:var(--red-bg);color:var(--red);font-size:14px;margin-bottom:14px}

/* travel mode */
.trav{margin-top:16px;padding:18px 20px;display:grid;gap:14px}
.trav.off{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.trav-ic{font-size:40px;line-height:1}
.trav.on{background:linear-gradient(135deg,var(--card),light-dark(#eaf7ef,#13261b));box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--green) 35%,transparent)}
.woh{display:flex;gap:16px;align-items:center}
.woh-em{font-size:58px;line-height:1;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15))}
.woh-en{font-size:clamp(28px,6vw,38px);font-weight:850;letter-spacing:-.02em;line-height:1.05}
.woh-ru{font-size:18px;font-weight:650;color:var(--green-ink)}
.steps{margin:0;padding-left:22px;display:grid;gap:8px;font-size:15px}
.steps li::marker{font-weight:800;color:var(--blue)}
a.btn{text-decoration:none}

  ["Umbrella","зонт","защищает от дождя","☂️"]
];

const fm = FileManager.local();
const PATH = fm.joinPath(fm.documentsDirectory(), "travel-english-mode.json");
function getMode() { try { return JSON.parse(fm.readString(PATH)) || { on: false }; } catch (e) { return { on: false }; } }
function setMode(on) { const m = { on: on, since: on ? Date.now() : null }; fm.writeString(PATH, JSON.stringify(m)); return m; }

// Same formula as in the TRAVEL ENGLISH app, so the word matches everywhere.
function hourIndex(d) { return Math.floor((d.getTime() / 60000 - d.getTimezoneOffset()) / 60); }
function wordAt(d) { const n = WORDS.length; return WORDS[((hourIndex(d) * 73) % n + n) % n]; }
function nextHour() { const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1); return d; }
function hhmm(d) { return ("0" + d.getHours()).slice(-2) + ":00"; }
function tripDay(m) { return m.since ? Math.floor((Date.now() - m.since) / 86400000) + 1 : 1; }

const params = args.queryParameters || {};
if (params.mode === "on") setMode(true);
if (params.mode === "off") setMode(false);
let mode = getMode();

function text(stack, value, font, color, lines, scale) {
  const t = stack.addText(value);
  t.font = font;
  if (color) t.textColor = color;
  if (lines) t.lineLimit = lines;
  t.minimumScaleFactor = scale || 0.6;
  return t;
}

function buildWidget(family) {
  const w = new ListWidget();
  w.refreshAfterDate = nextHour();
  w.url = URLScheme.forRunningScript();
  const word = wordAt(new Date());
  const [en, ru, meaning, emoji] = word;

  // ---------- Lock screen ----------
  if (family === "accessoryInline") {
    w.addText(mode.on ? emoji + " " + en + " — " + ru : "🏠 Travel English · выкл.");
    return w;
  }
  if (family === "accessoryCircular") {
    w.addAccessoryWidgetBackground = true;
    const s = w.addStack(); s.layoutVertically(); s.centerAlignContent();
    if (mode.on) { text(s, emoji, Font.systemFont(20), null, 1); text(s, en, Font.boldSystemFont(11), null, 1, 0.5); }
    else { text(s, "🏠", Font.systemFont(22), null, 1); text(s, "выкл.", Font.mediumSystemFont(10), null, 1); }
    return w;
  }
  if (family === "accessoryRectangular") {
    if (!mode.on) {
      text(w, "🏠 TRAVEL ENGLISH", Font.boldSystemFont(13), null, 1);
      text(w, "Режим путешествия выключен", Font.systemFont(12), null, 1);
      text(w, "Нажмите → ✈️ Я улетел", Font.mediumSystemFont(12), null, 1);
      return w;
    }
    text(w, emoji + " " + en.toUpperCase(), Font.heavySystemFont(16), null, 1, 0.55);
    text(w, ru, Font.semiboldSystemFont(14), null, 1, 0.6);
    text(w, meaning, Font.systemFont(12), null, 1, 0.55);
    return w;
  }

  // ---------- Home screen (small / medium / large) ----------
  const g = new LinearGradient();
  g.colors = [new Color("#1d1d1f"), new Color("#0f2a1c")];
  g.locations = [0, 1];
  w.backgroundGradient = g;
  w.setPadding(14, 16, 14, 16);
  const green = new Color("#3ccf82"), white = Color.white(), grey = new Color("#a1a1a8");
  const big = family === "medium" || family === "large";

  const head = w.addStack(); head.centerAlignContent();
  text(head, "✈️ WORD OF THE HOUR", Font.heavySystemFont(10), green, 1);
  head.addSpacer();
  if (mode.on && big) text(head, "День " + tripDay(mode), Font.boldSystemFont(10), grey, 1);
  w.addSpacer(big ? 8 : 6);

  if (!mode.on) {
    text(w, "🏠", Font.systemFont(30), null, 1);
    w.addSpacer(4);
    text(w, "Режим путешествия выключен", Font.boldSystemFont(14), white, 2);
    w.addSpacer(2);
    text(w, "Нажмите, чтобы включить ✈️", Font.systemFont(12), grey, 2);
    w.addSpacer();
    return w;
  }

  const row = w.addStack(); row.centerAlignContent();
  text(row, emoji, Font.systemFont(big ? 34 : 26), null, 1);
  row.addSpacer(8);
  text(row, en, Font.heavySystemFont(big ? 30 : 22), white, 1, 0.5);
  w.addSpacer(4);
  text(w, ru, Font.semiboldSystemFont(big ? 18 : 15), green, 1);
  w.addSpacer(2);
  text(w, meaning, Font.systemFont(big ? 14 : 12), grey, 2);
  w.addSpacer();
  text(w, "Новое слово в " + hhmm(nextHour()), Font.mediumSystemFont(10), grey, 1);
  return w;
}

if (config.runsInWidget) {
  Script.setWidget(buildWidget(config.widgetFamily));
} else if (params.mode) {
  // Opened from the TRAVEL ENGLISH app button: just switch and return.
  Script.complete();
} else {
  const a = new Alert();
  a.title = "✈️ TRAVEL ENGLISH";
  a.message = mode.on
    ? "Режим путешествия включён (день " + tripDay(mode) + "). Каждый час на экране блокировки — новое слово."
    : "Режим путешествия выключен. Включите его, и каждый час будет появляться новое слово.";
  a.addAction(mode.on ? "🏠 Я прилетел обратно" : "✈️ Я улетел");
  a.addAction("👀 Слово этого часа");
  a.addCancelAction("Закрыть");
  const r = await a.presentSheet();
  if (r === 0) mode = setMode(!mode.on);
  if (r === 1) {
    const [en, ru, meaning, emoji] = wordAt(new Date());
    const b = new Alert();
    b.title = emoji + " " + en;
    b.message = ru + "\n" + meaning + "\n\nСледующее слово в " + hhmm(nextHour());
    b.addAction("🔊 Произнести");
    b.addCancelAction("OK");
    if ((await b.presentAlert()) === 0) Speech.speak(en);
  }
  if (r === 0) await buildWidget("medium").presentMedium();
  Script.complete();
}

</script>

 return`<div class="fade-in"><div class="top"><div class="logo"><span class="logo-mark"><img src="icon-192.png" alt="" onerror="this.replaceWith(document.createTextNode('✈'))"></span>TRAVEL ENGLISH</div>

 <div style="display:grid;gap:16px"><div class="ring-wrap">${ring(total)}<div><div class="h3">${t('total')}</div><div class="tiny">${lessonsDone()}/30 · ${t('lessons_d').toLowerCase()}</div></div></div>
 <div class="stats">${[[unitsDone(0),t('words_l')],[unitsDone(1),t('conn_l')],[unitsDone(2),t('sent_l')],[lessonsDone(),t('lessons_d')],[testsPassed(),t('tests_p')],[sk,t('streak')]].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div></div></section>

 const rate=$('#rate');if(rate)rate.addEventListener('input',()=>{S.settings.rate=+rate.value;$('#rateval').textContent=S.settings.rate.toFixed(2)+'×';save()});
 const vs=$('#voice');if(vs)vs.addEventListener('change',()=>{S.settings.voice=vs.value;save();Speech.say('Welcome to Travel English.')});
 const ra=$('#remat');if(ra)ra.addEventListener('change',()=>{S.settings.remindAt=ra.value||'19:00';save()});}
function setTab(tab,push=true){UI.tab=tab;UI.sub=null;UI.full=null;if(push)try{history.replaceState(null,'','#'+HASH[tab])}catch(e){try{location.hash=HASH[tab]}catch(_){}}render();scrollTo(0,0)}
function openLesson(key){const L=getL(key);if(!lesOpen(L.si,L.li)){toast(t('sec_lock',{s:L.li?DATA[L.si].lessons[L.li-1].t:DATA[L.si-1]?.title||''}));return}UI.sub={type:'intro',key};render();scrollTo(0,0)}
function goLesson(key){const st=LS(key);if(st.stage==='learn'&&st.pos===0&&!st.attempts)st.intro=true;UI.full={type:'lesson',key};lastFrac=0;save();render()}

/* ================= events ================= */
document.addEventListener('click',e=>{lastAct=Date.now();
 const sayb=e.target.closest('[data-say]');if(sayb){e.stopPropagation();Speech.say(sayb.dataset.say,{slow:!!sayb.dataset.slow,btn:sayb});return}
 const b=e.target.closest('[data-a]');if(!b||!b.dataset.a)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
 case'tab':setTab(v);if(b.dataset.w)setTimeout(()=>$('#widget')?.scrollIntoView({behavior:'smooth'}),80);break;
 case'section':{const si=+v;if(!secOpen(si)){toast(t('sec_lock',{s:DATA[si-1].title}));return}UI.sub={type:'section',si};render();scrollTo(0,0);break}
 case'up':if(UI.sub?.type==='intro'){UI.sub={type:'section',si:getL(UI.sub.key).si}}else UI.sub=null;render();scrollTo(0,0);break;
 case'intro':openLesson(v);break;
 case'continue':{const c=current();if(c){UI.sub={type:'intro',key:c.key};goLesson(c.key)}else setTab('review');break}
 case'go':goLesson(v);break;
 case'restart':{const st=LS(v);Object.assign(st,{stage:'learn',pos:0,queue:null,qpos:0,test:null,intro:true});goLesson(v);break}
 case'retest':{const st=LS(v);Object.assign(st,{stage:'test',test:null,intro:true});goLesson(v);break}
 case'exit':{const f=UI.full;UI.full=null;if(f?.type==='lesson'){UI.sub={type:'intro',key:f.key};toast(t('saved'))}else if(f?.type==='review'){RV=null}save();render();break}
 case'stagego':{LS(UI.full.key).intro=false;save();render();break}
 case'lnext':{const st=LS(UI.full.key);st.pos++;st.learned=Math.max(st.learned||0,st.pos);markDay();if(st.pos>=20)nextStage(UI.full.key);save();render();break}
 case'lprev':{const st=LS(UI.full.key);if(st.pos>0)st.pos--;save();render();break}
 case'hidetr':S.settings.hideTr=!S.settings.hideTr;save();render();break;
 case'reveal':b.classList.remove('hid');b.dataset.a='';break;
 case'resnext':{const r=UI.full,L=getL(r.key);if(r.secDone){UI.full={type:'sectionDone',si:L.si};render();break}UI.full=null;UI.sub={type:'section',si:L.si};UI.justUnlocked=r.next;render();if(r.next)toast(t('unlocked',{s:getL(r.next).t}));const el=r.next&&$(`[data-v="${r.next}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});break}
 case'reslessons':{const L=getL(UI.full.key);UI.full=null;UI.sub={type:'section',si:L.si};render();break}
 case'resretry':{const k=UI.full.key;UI.sub={type:'intro',key:k};UI.full={type:'lesson',key:k};lastFrac=0;render();break}
 case'opensec':UI.full=null;UI.tab='learn';UI.sub={type:'section',si:+v};UI.justUnlocked=DATA[+v].lessons[0].key;render();scrollTo(0,0);break;
 case'rvsrc':UI.rvSrc=v;render();break;
 case'rvstart':startReview(v);break;
 case'rvagain':startReview(RV.mode);break;
 case'rvexit':RV=null;UI.full=null;render();break;
 case'set':S.settings[b.dataset.k]=!S.settings[b.dataset.k];if(b.dataset.k==='sound'&&!S.settings.sound)try{speechSynthesis.cancel()}catch(_){}save();render();break;
 case'mode':S.settings.mode=v;save();render();break;
 case'lang':S.settings.lang=v;save();render();break;
case'travel':{const on=!S.settings.travel;S.settings.travel=on;S.settings.travelSince=on?Date.now():null;markDay();save();render();if(on)confetti();travelModal(on);break}
 case'copyscript':{const src=$('#widget-src')?.textContent.trim()||'';const box=$('#scriptbox');const show=()=>{box.hidden=false;box.value=src;box.focus();box.select();toast(t('wg_copied'))};
  try{navigator.clipboard.writeText(src).then(()=>toast(t('wg_copied')),show)}catch(_){show()}break}
 case'testvoice':Speech.say('Where is the nearest pharmacy?',{btn:b});break;
 case'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}break;
 case'reset':{const m=modal(`<div style="font-size:44px">⚠️</div><h2 class="h2">${t('reset_q')}</h2><p class="muted">${t('reset_qd')}</p><div class="row"><button class="btn ghost wide" data-m="no">${t('cancel')}</button><button class="btn red wide" data-m="yes">${t('do_reset')}</button></div>`);
  m.addEventListener('click',ev=>{const x=ev.target.closest('[data-m]');if(!x)return;if(x.dataset.m==='yes'){const keep=S.settings;S=fresh();S.settings=keep;save();toast(t('reset_ok'));UI.sub=null}m.remove();render()});break}
 }});
document.addEventListener('keydown',e=>{lastAct=Date.now();const fb=$('.feedback');
 if(fb&&e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();$('#nextq')?.click();return}
 if(!fb&&keyHandler&&e.target.tagName!=='INPUT')keyHandler(e);
 if(e.key==='Escape'&&$('.modal-bg'))$('.modal-bg').remove()});
document.addEventListener('pointerdown',()=>lastAct=Date.now(),{passive:true});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);const tab=Object.keys(HASH).find(k=>HASH[k]===h);if(tab&&tab!==UI.tab&&!UI.full)setTab(tab,false)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(UI.tab==='settings'&&!UI.full)render()});
let lastHour=hourIdx(new Date());setInterval(()=>{const h=hourIdx(new Date());if(h!==lastHour){lastHour=h;if(!UI.full&&!UI.sub&&UI.tab==='home'&&!$('.modal-bg'))render()}},30000);
let tick=0;setInterval(()=>{if(UI.full&&(UI.full.type==='lesson'||UI.full.type==='review')&&!document.hidden&&Date.now()-lastAct<60000){S.stats.time+=5;if(++tick%6===0)save()}},5000);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);

/* ================= boot ================= */
Speech.init();
{const h=location.hash.slice(1);const tab=Object.keys(HASH).find(k=>HASH[k]===h);if(tab)UI.tab=tab}
render();
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){try{addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}catch(e){}}
window.__TE={S:()=>S,UI,DATA,okEn,okRu,normEn};
}
